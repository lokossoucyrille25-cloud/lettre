<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <!-- Fond sombre de l'icône -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1d2b"/>
      <stop offset="100%" stop-color="#0f111a"/>
    </linearGradient>

    <!-- Dégradé du cercle lumineux -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c63d8"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Dégradé du cœur -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Dégradé de la lettre L -->
    <linearGradient id="lGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fce8ed"/>
    </linearGradient>

    <!-- Dégradé de la lettre C -->
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Effet de lueur légère -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#e11d48" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fond de l'application (Icône arrondie) -->
  <rect x="50" y="20" width="400" height="400" rx="85" ry="85" fill="url(#bgGrad)" stroke="#25293c" stroke-width="2"/>

  <!-- Cercle néon extérieur -->
  <circle cx="250" cy="220" r="130" fill="none" stroke="url(#ringGrad)" stroke-width="6"/>

  <!-- Lettre C (Arrière-plan entrelacé) -->
  <path d="M 305 185
           C 295 162 272 148 245 148
           C 195 148 162 182 162 230
           C 162 274 195 302 245 302
           C 278 302 305 284 315 255
           C 317 249 311 244 305 246
           C 299 248 294 253 287 261
           C 276 274 261 281 243 281
           C 212 281 188 259 188 228
           C 188 196 212 169 245 169
           C 266 169 284 179 294 195
           C 298 201 305 200 308 194 Z" fill="url(#cGrad)"/>

  <!-- Lettre L (Serif au premier plan) -->
  <path d="M 172 148
           L 208 148
           C 213 148 216 150 216 153
           C 216 156 213 158 208 158
           L 198 158
           L 198 266
           L 242 266
           C 256 266 265 259 269 245
           C 270 241 273 240 275 240
           C 278 240 280 242 279 247
           L 273 275
           L 172 275
           C 167 275 165 273 165 270
           C 165 267 167 265 172 265
           L 181 265
           L 181 158
           L 172 158
           C 167 158 165 156 165 153
           C 165 150 167 148 172 148 Z" fill="url(#lGrad)"/>

  <!-- Cœur supérieur -->
  <g transform="rotate(-8 295 135)">
    <path d="M 295 165
             C 289 160 262 138 262 120
             C 262 105 274 93 288 93
             C 297 93 305 98 309 105
             C 313 98 321 93 330 93
             C 344 93 356 105 356 120
             C 356 138 329 160 323 165
             L 309 177 Z" fill="url(#heartGrad)" filter="url(#glow)"/>
  </g>

  <!-- Texte sous l'icône -->
  <text x="250" y="475" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" letter-spacing="0.5">Lettres d'Amour</text>
</svg>