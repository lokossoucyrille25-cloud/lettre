<svg width="120" height="120" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradé Rose/Rouge Passion -->
    <linearGradient id="lc-gradient" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Ombre portée douce -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f43f5e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond Circulaire Sombre (Optionnel) -->
  <rect width="200" height="200" rx="45" fill="#0f172a"/>

  <!-- Groupe Logo Monogramme LC + Cœur + Enveloppe -->
  <g filter="url(#glow)">
    <!-- Rabat d'enveloppe / Cœur stylisé -->
    <path d="M60 70 L100 105 L140 70" stroke="url(#lc-gradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Monogramme L -->
    <path d="M65 65 V135 H105" stroke="url(#lc-gradient)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Monogramme C enroulé autour du L -->
    <path d="M145 80 C145 60, 115 55, 100 70 C80 90, 80 120, 100 135 C120 150, 145 135, 145 120" stroke="url(#lc-gradient)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Petit point étincelle / Amour -->
    <circle cx="100" cy="105" r="6" fill="#ffffff" />
  </g>
</svg>